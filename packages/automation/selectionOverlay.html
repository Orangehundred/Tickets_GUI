<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background: rgba(0, 0, 0, 0.25);
      overflow: hidden;
      user-select: none;
    }
    #selection-box {
      position: absolute;
      border: 2px solid #0394f7;
      background: rgba(3, 148, 247, 0.15);
      display: none;
    }
    #hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="hint">Drag a box over the caller ID phone number, then release</div>
  <div id="selection-box"></div>

  <script>
  const { ipcRenderer } = require('electron');
  let displayLeft = null;
  let displayTop = null;
  let startX = 0, startY = 0;
  let dragging = false;

  const box = document.getElementById('selection-box');

  ipcRenderer.on('display-info', (_event, { displayLeft: l, displayTop: t }) => {
    displayLeft = l;
    displayTop = t;
  });

    document.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      box.style.left = startX + 'px';
      box.style.top = startY + 'px';
      box.style.width = '0px';
      box.style.height = '0px';
      box.style.display = 'block';
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const currentX = e.clientX;
      const currentY = e.clientY;

      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.width = width + 'px';
      box.style.height = height + 'px';
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;

      const left = Math.min(startX, e.clientX);
      const top = Math.min(startY, e.clientY);
      const width = Math.abs(e.clientX - startX);
      const height = Math.abs(e.clientY - startY);

      // Ignore accidental tiny clicks
      if (width < 5 || height < 5) {
        box.style.display = 'none';
        return;
      }

      // in mouseup handler:
      ipcRenderer.send('region-selected', {
        displayLeft,
        displayTop,
        x: left,
        y: top,
        width,
        height,
      });
    });
  </script>
</body>
</html>
